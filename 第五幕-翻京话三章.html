<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第五幕 · 翻《京话》三章</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M6 3h12v2H6zm1 4h10v2H7zm0 4h10v2H7zm-2 8h14a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2z' fill='%23d9a35c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  background:#0a0805;color:#f2e7cf;overflow:hidden;-webkit-font-smoothing:antialiased}
.page{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;
  box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);overflow:hidden;
  opacity:0;transform:scale(.988);transition:opacity .7s ease-out,transform .7s ease-out}
.stage.in{opacity:1;transform:scale(1)}
/* 米黄书页背景 */
.paper-bg{position:absolute;inset:0;
  background:radial-gradient(120% 100% at 50% 20%,#d8c59b 0%,#c9b488 45%,#a68e5e 100%)}
.paper-bg::before{content:'';position:absolute;inset:0;opacity:.6;
  background:repeating-linear-gradient(0deg,transparent 0 26px,rgba(120,92,48,.05) 26px 27px)}
.paper-bg::after{content:'';position:absolute;inset:0;
  background:radial-gradient(70% 80% at 50% 30%,transparent 45%,rgba(80,58,30,.45) 100%)}
/* 日晷 */
.dial-btn{position:absolute;z-index:20;left:2vmin;top:2vmin;width:clamp(54px,8.4vmin,88px);
  aspect-ratio:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.dial-btn svg{width:100%;height:100%}
/* 章节标题 */
.ch-title{position:absolute;z-index:5;left:50%;top:3.6vmin;transform:translateX(-50%);text-align:center;pointer-events:none}
.ch-title .pre{display:block;font-size:clamp(10px,1.6vmin,15px);color:#7a5f33;letter-spacing:.4em;margin-bottom:.4em}
.ch-title h1{font-size:clamp(18px,3vmin,30px);font-weight:700;color:#3c2a12;letter-spacing:.2em;text-indent:.2em;
  text-shadow:0 1px 0 rgba(255,255,255,.25)}
/* 摊开的书 */
.book{position:absolute;z-index:6;left:50%;top:52.5%;transform:translate(-50%,-50%);
  width:min(86vmin,1280px);height:min(52vmin,540px);
  display:flex;filter:drop-shadow(0 20px 44px rgba(0,0,0,.5))}
.page-l,.page-r{width:50%;height:100%;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#efe3c4,#f4e9cd 55%,#e8dab6);
  transition:opacity .24s ease,transform .24s ease}
.page-l{border-radius:4px 0 0 4px;box-shadow:inset -14px 0 26px rgba(120,90,40,.3),inset 0 0 40px rgba(140,110,60,.2)}
.page-r{border-radius:0 4px 4px 0;box-shadow:inset 14px 0 26px rgba(120,90,40,.3),inset 0 0 40px rgba(140,110,60,.2)}
.book.anim .page-l{opacity:0;transform:translateX(-2%) rotate(-.4deg)}
.book.anim .page-r{opacity:0;transform:translateX(2%) rotate(.4deg)}
.page-l img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.page-l .ring{position:absolute;z-index:2;font-size:clamp(12px,1.9vmin,18px);font-weight:700;color:#a01f14;
  padding:.1em .35em;border:2px solid #b3291c;border-radius:2.5em;background:rgba(255,255,255,.5)}
.ring.r1{left:8%;bottom:16%;transform:rotate(-8deg)}
.ring.r2{left:34%;bottom:44%;transform:rotate(5deg)}
.ring.r3{left:60%;bottom:26%;transform:rotate(-4deg)}
.page-r .r-body{position:absolute;inset:0;padding:7% 8%;color:#3c2c18;overflow:hidden}
.page-r .r-kicker{font-size:clamp(10px,1.5vmin,14px);color:#8a6a3a;letter-spacing:.22em;margin-bottom:2%}
.page-r .r-text{font-family:"Ma Shan Zheng","Kaiti SC",cursive;
  font-size:clamp(13px,2.05vmin,20px);line-height:1.95;text-align:justify;white-space:pre-line}
.page-r .r-text .u{color:#a01f14;font-weight:700;position:relative;margin:0 .04em}
.page-r .r-text .u::after{content:'';position:absolute;left:-.3em;top:-.28em;width:1.7em;height:1.7em;
  border:1.6px solid #c23a26;border-radius:50%}
/* 末页手写 */
.last-word{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:1.6vmin;padding:6% 10%;text-align:center}
.last-word.on{display:flex}
.last-word .lw{font-family:"Zhi Mang Xing","Ma Shan Zheng",cursive;
  font-size:clamp(16px,2.6vmin,26px);line-height:1.7;color:#5d3a16;letter-spacing:.06em;
  text-shadow:0 1px 0 rgba(255,255,255,.3)}
.last-word .lw b{color:#a01f14;font-weight:700}
/* 页码 */
.page-no{position:absolute;z-index:8;right:7%;bottom:3.4%;color:#7a5f33;font-size:clamp(12px,1.9vmin,18px);
  font-family:"Ma Shan Zheng",cursive}
/* 箭头 */
.arrow{position:absolute;z-index:9;top:50%;transform:translateY(-50%);cursor:pointer;
  width:clamp(36px,5.2vmin,54px);height:clamp(36px,5.2vmin,54px);display:flex;align-items:center;justify-content:center;
  background:rgba(60,42,18,.6);border:1.5px solid rgba(232,217,172,.6);border-radius:50%;
  color:#f0e3bd;font-size:clamp(14px,2.2vmin,22px);transition:background .25s,transform .2s;user-select:none}
.arrow:hover{background:rgba(217,163,92,.4);transform:translateY(-50%) scale(1.06)}
.arrow-left{left:calc(50% - min(86vmin,1280px)/2 - 4.4vmin)}
.arrow-right{right:calc(50% - min(86vmin,1280px)/2 - 4.4vmin)}
.arrow:disabled{opacity:.25;cursor:default;transform:translateY(-50%)}
/* 合上书 */
.close-btn{position:absolute;z-index:12;left:50%;bottom:5%;transform:translateX(-50%);display:none;
  width:clamp(140px,21vmin,220px);padding:.8em 0;border-radius:3px;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#e9c77f,#c99b52 60%,#8a6a2f);border:1.5px solid #f0e3c0;
  color:#2d1f0d;font-size:clamp(13px,2vmin,19px);font-weight:700;letter-spacing:.24em;text-indent:.24em;
  box-shadow:0 8px 22px rgba(0,0,0,.45);transition:transform .2s,box-shadow .2s;user-select:none}
.close-btn.on{display:block}
.close-btn:hover{transform:scale(1.04)}
.fadeout{opacity:0 !important;transition:opacity .9s ease}
</style>
<style id="dh-style">
/* ===== 日晷增强（青铜金纹 + 拨动金光） ===== */
.sundial,.dial-btn{position:relative;filter:drop-shadow(0 5px 12px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(201,168,106,.22));transition:filter .5s ease}
.sundial:hover,.dial-btn:hover{filter:drop-shadow(0 5px 16px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(233,196,120,.6))}
.sundial::before,.dial-btn::before{content:"";position:absolute;inset:-16%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,132,.5) 0%,rgba(255,210,132,.13) 42%,transparent 68%);
  opacity:0;pointer-events:none;z-index:1;transition:opacity .35s ease}
.sundial.dh-glow::before,.dial-btn.dh-glow::before{opacity:1;animation:dhGlowPulse 1.05s ease-out}
@keyframes dhGlowPulse{0%{transform:scale(.84);opacity:.95}100%{transform:scale(1.2);opacity:0}}
.sundial .dh-ring,.dial-btn .dh-ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;opacity:.92;filter:drop-shadow(0 0 3px rgba(255,205,120,.45))}
/* 日晷展开面板（全站统一） */
.dial-full{position:absolute;inset:0;z-index:60;background:rgba(6,4,2,.8);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:2.2vmin}
.dial-full.on{display:flex;animation:fadeIn .4s ease-out}
.dial-full .big{width:clamp(220px,32vmin,340px);aspect-ratio:1;animation:dropIn .65s cubic-bezier(.2,1.4,.4,1) both}
.dial-full .cap{font-family:"Ma Shan Zheng","Kaiti SC",cursive;font-size:clamp(19px,3vmin,30px);
  color:#e9d9a8;letter-spacing:.3em;text-indent:.3em;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.dial-full .sub{font-size:clamp(11px,1.6vmin,15px);color:#b9a376;letter-spacing:.22em;text-indent:.22em;text-align:center;max-width:min(72vmin,560px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dropIn{from{opacity:0;transform:scale(.7) translateY(-24px)}to{opacity:1;transform:scale(1) translateY(0)}}
</style></head>
<body>

  <div class="stage" id="stage">

      <text x="200" y="63" text-anchor="middle" font-size="23" fill="rgba(216,226,184,.9)" font-family="Kaiti SC,STKaiti,serif">辰</text>
      <line id="dialHourBig" x1="200" y1="200" x2="374" y2="200" stroke="#d9c07e" stroke-width="7" stroke-linecap="round"/>
      <line id="dialMinBig" x1="200" y1="200" x2="26" y2="200" stroke="#4a3a22" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="200" cy="200" r="26" fill="#2b2415" stroke="rgba(255,240,205,.5)" stroke-width="2"/>

    <!-- 图片池（路径仅存在于 HTML src） -->
    <div class="imgpool" hidden>
      <img data-ch="1" src="assets/p14-ch1-congee.png" alt="">

<script>
(function(){
var stage=document.getElementById('stage');
setTimeout(function(){stage.classList.add('in');},60);

/* 日晷指针 */
var hourIdx=3; /* 辰时 */
var NAMES=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
function rot(hour){
  var a=hour/12*360-90, b=((hour+6)%12)/12*360-90;
  ['dialHour','dialHourBig'].forEach(function(id){
    var h=document.getElementById(id);
    if(!h)return;
    h.setAttribute('x2',String(200+180*Math.cos(a*Math.PI/180)));
    h.setAttribute('y2',String(200+180*Math.sin(a*Math.PI/180)));
  });
  ['dialMin','dialMinBig'].forEach(function(id){
    var m=document.getElementById(id);
    if(!m)return;
    m.setAttribute('x2',String(200+180*Math.cos(b*Math.PI/180)));
    m.setAttribute('y2',String(200+180*Math.sin(b*Math.PI/180)));
  });
}
rot(4);
/* 更新日晷汉字 */
function setDialChar(ch){
  var t=document.querySelector('.dial-btn text');
  if(t)t.textContent=ch;
  var bt=document.querySelector('#dialFull .big text');
  if(bt)bt.textContent=ch;
}

/* 三章内容 */
var CH=[
 {name:'第一章 · 鼓楼的糖粥',pre:'第五幕 · 晨',ch:1,
  rings:[['糖粥','r1'],['鼓楼','r2'],['等你','r3']],
  text:'鼓楼底下那家糖粥摊，开了三十多年。摊主姓沈，粥熬得稠，一碗五分钱，加一勺桂花。\n冬天早晨，雾从城门洞里钻进来，粥的热气顶在摊布上，谁也看不见谁。\n他说过，回南京先喝一碗这里的糖粥。\n我没告诉他——这碗粥，我替他喝了三年。',
  u:['鼓楼','糖粥','等你'],no:79},
 {name:'第二章 · 颐和路的梧桐',pre:'第五幕 · 午',ch:2,
  rings:[['颐和路','r1'],['梧桐','r2'],['等你','r3']],
  text:'颐和路的梧桐，是民国十七年栽的。公馆的墙一年比一年旧，梧桐一年比一年高。\n秋天的叶子落满整条路，扫也扫不完。\n从前我们一起走这条路，他说树荫好，夏天不用打伞。\n今年梧桐又黄了。路还是那条路，人少了一个。',
  u:['颐和路','梧桐','等你'],no:80},
 {name:'第三章 · 阅江楼的江风',pre:'第五幕 · 黄昏',ch:3,
  rings:[['阅江楼','r1'],['江风','r2'],['等你','r3']],
  text:'阅江楼上看长江，一年四季都有风。冬天的风最烈，能把人吹得站不稳。\n他说站在这里，才觉得南京的江是真的江。\n江风年年吹，吹过楼，吹过船，吹过那些没寄出去的话。\n我把想说的，都写在这一章里了。',
  u:['阅江楼','江风','等你'],no:81}
];
function getChImg(n){
  var im=document.querySelector('.imgpool img[data-ch="'+n+'"]');
  return im?im.getAttribute('src'):'';
}
var cur=0; /* 0-2 章；3=末页 */
var LAST='这本原本是要给他的。但我知道他不会回来看。所以我把它写给以后某个会真的走到南京来的人。';

function render(){
  var pl=document.getElementById('pageL'),pr=document.getElementById('pageR');
  var pn=document.getElementById('pageNo');
  var cN=document.getElementById('chName'),cP=document.getElementById('chPre');
  var book=document.getElementById('book');
  book.classList.add('anim');
  setTimeout(function(){
    book.classList.remove('anim');
    if(cur===3){
      /* 末页 */
      pl.innerHTML='';
      pr.innerHTML='<div class="last-word on">'+
        '<div class="lw">这本原本是要给他的。</div>'+
        '<div class="lw">但我知道他不会回来看。</div>'+
        '<div class="lw">所以我把它写给<b>以后某个会真的走到南京来的人</b>。</div>'+
        '</div>';
      pn.textContent='—';
      cN.textContent='最后一页';
      cP.textContent='第五幕 · 黄昏';
      document.getElementById('arrowR').disabled=true;
      document.getElementById('arrowL').disabled=false;
      document.getElementById('closeBtn').classList.add('on');
      setDialChar('酉');
      rot(9);
    }else{
      var c=CH[cur];
      pl.innerHTML='<img src="'+getChImg(c.ch)+'" alt="">';
      var txt=c.text;
      c.u.forEach(function(w){
        txt=txt.split(w).join('<span class="u">'+w+'</span>');
      });
      pr.innerHTML='<div class="r-body"><div class="r-kicker">姚颖 · 专栏</div><div class="r-text">'+txt+'</div></div>';
      pn.textContent=c.no;
      cN.textContent=c.name;
      cP.textContent=c.pre;
      var hour=c.no===79?4:(c.no===80?6:9);
      setDialChar(NAMES[hour]);
      rot(hour);
      document.getElementById('arrowR').disabled=false;
      document.getElementById('arrowL').disabled=false;
      document.getElementById('closeBtn').classList.remove('on');
    }
  },240);
}
document.getElementById('arrowR').onclick=function(){ if(cur<3){cur++;render();} };
document.getElementById('arrowL').onclick=function(){ if(cur>0){cur--;render();} };
document.getElementById('closeBtn').onclick=function(){
  stage.classList.add('fadeout');
  setTimeout(function(){location.href='第三幕-题7-关键词拼图.html';},950);
};
render();
})();
</script>
<audio id="dhKeySnd" src="assets/typewriter-key.mp3" preload="auto"></audio>

<script id="dh-sfx">
(function(){
/* 真实打字机音效层 */
window.__sfx={
  key:function(){try{var a=document.getElementById('dhKeySnd');a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){});}catch(e){}},
  ding:function(){try{var a=document.getElementById('dhDingSnd');a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){});}catch(e){}},
  carriage:function(){try{var a=document.getElementById('dhCarSnd');a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
};
/* 日晷刻度环 overlay + 拨动金光 */
var NS='http://www.w3.org/2000/svg';
function addRing(d){
  if(d.querySelector('.dh-ring'))return;
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('class','dh-ring');
  var g=document.createElementNS(NS,'g');
  var rim=document.createElementNS(NS,'circle');
  rim.setAttribute('cx','50');rim.setAttribute('cy','50');rim.setAttribute('r','46');
  rim.setAttribute('fill','none');rim.setAttribute('stroke','rgba(214,178,106,.95)');rim.setAttribute('stroke-width','2.4');
  g.appendChild(rim);
  var names=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  for(var i=0;i<12;i++){
    var a=(i*30-90)*Math.PI/180;
    var inner=42,outer=(i%3===0)?45.5:43.5;
    var ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',50+inner*Math.cos(a));ln.setAttribute('y1',50+inner*Math.sin(a));
    ln.setAttribute('x2',50+outer*Math.cos(a));ln.setAttribute('y2',50+outer*Math.sin(a));
    ln.setAttribute('stroke','rgba(240,205,120,.95)');ln.setAttribute('stroke-width',i%3===0?'1.6':'1');ln.setAttribute('stroke-linecap','round');
    g.appendChild(ln);
    var t=document.createElementNS(NS,'text');
    t.setAttribute('x',50+30*Math.cos(a));t.setAttribute('y',50+30*Math.sin(a)+3);
    t.setAttribute('text-anchor','middle');t.setAttribute('font-size','6.6');
    t.setAttribute('fill','rgba(233,208,158,.95)');t.setAttribute('font-family','Kaiti SC,STKaiti,serif');
    t.textContent=names[i];g.appendChild(t);
  }
  svg.appendChild(g);d.appendChild(svg);
  var timer=null;
  function glow(){d.classList.remove('dh-glow');void d.offsetWidth;d.classList.add('dh-glow');if(timer)clearTimeout(timer);timer=setTimeout(function(){d.classList.remove('dh-glow');},1100);}
  try{
    var ob=new MutationObserver(function(muts){for(var k=0;k<muts.length;k++){if(muts[k].type==='attributes'){glow();break;}}});
    ob.observe(d,{subtree:true,attributes:true,attributeFilter:['transform','style']});
  }catch(e){}
  d.addEventListener('click',glow);
}
