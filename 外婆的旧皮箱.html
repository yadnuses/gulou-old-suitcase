<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外婆的旧皮箱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M7 7V6a5 5 0 0 1 10 0v1h1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1zm2 0h6V6a3 3 0 0 0-6 0v1zM9 12v2h6v-2H9z' fill='%23d9a35c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
/* ============ 基础 ============ */
:root{
  --ink:#f2e7cf;
  --ink-dim:#cfbe9a;
  --amber:#d9a35c;
  --amber-bright:#ffd98a;
  --line:rgba(217,163,92,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  background:radial-gradient(130% 100% at 50% 8%,#202a3d 0%,#151c2b 55%,#0c1119 100%);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.page{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}

/* ============ 舞台（16:9 固定画幅） ============ */
.stage{
  position:relative;
  width:min(100vw,calc(100vh * 16 / 9));
  aspect-ratio:16/9;
  background:#0c1119;
  box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07);
  overflow:hidden;
  animation:stageIn .7s ease-out both;
}
@keyframes stageIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
.scene-fallback{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.scene-video{position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:cover;display:block}
.vignette{position:absolute;inset:0;z-index:12;pointer-events:none;
  background:radial-gradient(115% 105% at 50% 42%,transparent 58%,rgba(8,6,12,.34) 100%)}
.fade-out{transition:opacity .5s ease !important;opacity:0 !important}

/* ============ 皮箱层（透明抠图） ============ */
.suitcase{position:absolute;z-index:14;display:block;pointer-events:none;
  will-change:transform,opacity}
.suitcase-closed{
  left:30.99%;top:39.13%;width:39.49%;aspect-ratio:1077/530;
  transform:translateY(135%);opacity:0;
  transition:transform .85s cubic-bezier(.16,1.5,.3,1),opacity .3s ease;
}
.stage.entered .suitcase-closed{transform:translateY(0);opacity:1}
.suitcase-open{
  left:30.11%;top:11.85%;width:41.54%;aspect-ratio:1134/957;
  opacity:0;transform:scale(.93);
  transition:opacity .45s ease .12s,transform .5s ease .12s;
}
.suitcase-open.show{opacity:1;transform:scale(1)}
.glow-open{position:absolute;z-index:13;left:28%;top:36%;width:44%;height:46%;
  pointer-events:none;opacity:0;transition:opacity .7s ease;
  background:radial-gradient(50% 50% at 50% 58%,rgba(255,206,116,.5),rgba(255,180,80,.16) 55%,transparent 76%)}
.glow-open.show{opacity:1}

/* ============ 对话文字（HTML 层） ============ */
.dialogue{position:absolute;z-index:22;left:32.5%;top:83.3%;width:35%;height:4.4%;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  text-align:center;color:#f7efda;letter-spacing:.08em;line-height:1.45;
  font-size:clamp(11px,1.78vmin,16px);
  text-shadow:0 1px 3px rgba(0,0,0,.6),0 0 12px rgba(0,0,0,.25);
  opacity:0;transition:opacity .9s ease .15s}
.stage.entered .dialogue{opacity:1}

/* ============ 三角标识（背包入口，HTML/SVG 层） ============ */
.tri-btn{position:absolute;z-index:24;left:46.3%;top:92.4%;width:7.6%;height:7.2%;
  border:0;background:transparent;cursor:pointer;padding:0;
  opacity:0;transition:opacity .6s ease .3s}
.tri-btn svg{width:100%;height:100%;display:block;overflow:visible}
.stage.entered .tri-btn{opacity:1}
.tri-btn::after{content:"";position:absolute;inset:4%;
  border:1px solid rgba(255,214,140,.55);border-radius:8px;pointer-events:none;
  animation:ringPulse 2.6s ease-out infinite}
@keyframes ringPulse{0%{opacity:.9;transform:scale(.94)}70%{opacity:0;transform:scale(1.3)}100%{opacity:0;transform:scale(1.3)}}

/* ============ 交互热区 ============ */
.hotspot{position:absolute;z-index:20;border:0;background:transparent;cursor:pointer;padding:0}
.hotspot:focus-visible{outline:2px solid var(--amber-bright);outline-offset:2px;border-radius:6px}
.hotspot-suitcase{left:31%;top:39%;width:39.5%;height:34.6%;min-width:60px;min-height:60px}
.hotspot-suitcase::after{content:"";position:absolute;inset:4%;
  border-radius:12px;pointer-events:none;
  background:radial-gradient(62% 55% at 50% 50%,rgba(255,215,140,.16),rgba(255,215,140,.04) 55%,transparent 76%);
  animation:breath 3.1s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}

/* ============ 开箱特效 ============ */
.flash{position:absolute;inset:0;z-index:17;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 55%,rgba(255,232,180,.55),rgba(255,202,112,.2) 42%,transparent 74%)}
.flash.go{animation:flashA .95s ease-out forwards}
@keyframes flashA{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
.burst{position:absolute;z-index:18;left:50%;top:56%;width:6%;height:6%;
  transform:translate(-50%,-50%) scale(0);pointer-events:none;opacity:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,238,196,.95) 0%,rgba(255,205,120,.55) 30%,rgba(255,180,80,0) 66%)}
.burst.go{animation:burst 1.2s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}10%{opacity:1}100%{transform:translate(-50%,-50%) scale(14);opacity:0}}
.dust{position:absolute;z-index:19;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,#ffe9b8 0%,#e0a94f 70%)}
.paper{position:absolute;z-index:19;pointer-events:none;border-radius:2px;
  background:linear-gradient(160deg,#efe4c4,#dfcfa1);
  box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(150,120,60,.25)}
.paper::after{content:"";position:absolute;left:10%;top:8%;right:10%;bottom:8%;
  background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(120,95,50,.15) 6px 7px)}
.paper.ambient{animation:paperDrift 7s ease-in-out infinite}
@keyframes paperDrift{
  0%,100%{transform:translate(0,0) rotate(var(--r0))}
  50%{transform:translate(var(--dx),var(--dy)) rotate(var(--r1))}
}

/* ============ 背包角标 ============ */
.badge{position:absolute;z-index:26;top:-4px;right:-8px;min-width:clamp(16px,2.6vmin,23px);
  height:clamp(16px,2.6vmin,23px);border-radius:999px;background:#c0392b;color:#fff;
  font-size:clamp(10px,1.5vmin,13px);font-weight:600;display:flex;align-items:center;justify-content:center;
  border:1px solid #ffd0a0;box-shadow:0 2px 6px rgba(0,0,0,.4);
  opacity:0;transform:scale(0);transition:opacity .3s,transform .3s;pointer-events:none}
.badge.on{opacity:1;transform:scale(1)}

/* ============ 背包面板 ============ */
.scrim{position:absolute;inset:0;z-index:30;background:rgba(7,5,3,.55);opacity:0;
  pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.inventory-panel{position:absolute;left:0;right:0;bottom:0;z-index:31;
  transform:translateY(103%);transition:transform .48s cubic-bezier(.22,.9,.3,1);
  background:linear-gradient(180deg,rgba(48,33,18,.97),rgba(27,18,9,.98) 45%,rgba(15,10,5,.99));
  border-top:1px solid var(--line);
  box-shadow:0 -14px 44px rgba(0,0,0,.55);
  padding:clamp(10px,1.6vmin,18px) clamp(12px,2.6vmin,30px) clamp(14px,2.6vmin,28px)}
.inventory-panel.open{transform:translateY(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:clamp(10px,1.4vmin,16px)}
.panel-title{font-size:clamp(13px,2.1vmin,19px);font-weight:600;color:#f2dcaa;letter-spacing:.1em}
.panel-title em{font-style:normal;font-size:.72em;color:var(--ink-dim);letter-spacing:.05em}
.panel-close{background:none;border:0;color:#d8bc7f;font-size:clamp(17px,2.6vmin,24px);
  line-height:1;cursor:pointer;padding:4px 6px}
.panel-close:hover{color:var(--amber-bright)}
.item-grid{display:flex;flex-wrap:wrap;gap:clamp(9px,1.4vmin,18px);justify-content:center;position:relative}
.empty-tip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:clamp(15px,2.5vmin,22px);color:rgba(226,205,160,.6);letter-spacing:.4em;text-indent:.4em;
  pointer-events:none}
.item-slot{width:clamp(54px,8.6vmin,96px);aspect-ratio:1/1;position:relative;padding:0;
  border:1px solid rgba(217,163,92,.48);border-radius:9px;background-color:#231a0f;cursor:pointer;
  background-image:url('assets/items-strip.png');
  background-size:300% 200%;background-repeat:no-repeat;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 3px 9px rgba(0,0,0,.42);
  transition:border-color .25s,box-shadow .25s,transform .25s}
.item-slot:hover{transform:translateY(-3px);border-color:var(--amber-bright);
  box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 12px rgba(255,205,110,.35)}
.item-slot.sel{border-color:var(--amber-bright);
  box-shadow:0 0 14px rgba(255,200,110,.55),inset 0 0 12px rgba(255,200,110,.2)}
.item-slot.locked{filter:brightness(.42) saturate(.35);cursor:not-allowed}
.item-slot.locked:hover{transform:none;border-color:rgba(217,163,92,.48);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 3px 9px rgba(0,0,0,.42)}
.slot-name{position:absolute;left:50%;bottom:-1.28em;transform:translateX(-50%);
  font-size:clamp(10px,1.35vmin,13px);color:#e9dab8;white-space:nowrap;opacity:.92;letter-spacing:.04em}
.item-detail{margin-top:clamp(13px,2.2vmin,22px);min-height:clamp(24px,4.2vmin,46px);
  text-align:center;font-size:clamp(12px,1.9vmin,17px);color:#f4e8cd;line-height:1.65;letter-spacing:.03em}
.item-detail .dim{color:#a8986f;font-size:.92em}

/* ============ 提示浮层 ============ */
.toast{position:absolute;z-index:40;left:50%;top:12.5%;transform:translate(-50%,-8px);opacity:0;
  pointer-events:none;max-width:82%;text-align:center;
  background:rgba(17,11,6,.84);border:1px solid rgba(217,163,92,.5);color:#f6ecd4;
  padding:.52em 1em;border-radius:6px;font-size:clamp(12px,1.8vmin,16px);letter-spacing:.06em;
  box-shadow:0 6px 18px rgba(0,0,0,.45);transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 窄屏适配 ============ */
@media (max-width:640px){
  .item-slot{width:clamp(48px,12.4vw,58px)}
  .item-grid{gap:clamp(7px,2vw,12px)}
}
@media (prefers-reduced-motion:reduce){
  .stage,.hotspot-suitcase::after,.tri-btn::after{animation:none}
  .inventory-panel{transition-duration:.15s}
  .suitcase-closed{transition-duration:.2s}
}
</style>
<style id="dh-style">
/* ===== 日晷增强（青铜金纹 + 拨动金光） ===== */
.sundial,.dial-btn{position:relative;filter:drop-shadow(0 5px 12px rgba(0,0,0,.55)) drop-shadow(0 0 5px rgba(201,168,106,.22));transition:filter .5s ease}
.sundial:hover,.dial-btn:hover{filter:drop-shadow(0 5px 16px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(233,196,120,.6))}
.sundial::before,.dial-btn::before{content:"";position:absolute;inset:-16%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,132,.5) 0%,rgba(255,210,132,.13) 42%,transparent 68%);
  opacity:0;pointer-events:none;z-index:1;transition:opacity .35s ease}
.sundial.dh-glow::before,.dial-btn.dh-glow::before{opacity:1;animation:dhGlowPulse 1.05s ease-out}
@keyframes dhGlowPulse{0%{transform:scale(.84);opacity:.95}100%{transform:scale(1.2);opacity:0}}
.sundial .dh-ring,.dial-btn .dh-ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;opacity:.92;filter:drop-shadow(0 0 3px rgba(255,205,120,.45))}
</style></head>
<body>
<div class="page" id="page">
  <div class="stage" id="stage">

    <!-- ===== 动态背景：火车窗外草原循环视频 ===== -->
    <img class="scene-fallback" src="assets/bg-clean.png" alt="黄昏草原">
    <video class="scene-video" id="bgVideo" autoplay muted loop playsinline preload="auto" aria-label="火车窗外黄昏草原向后移动">
      <source src="assets/bg-video.mp4" type="video/mp4">
    </video>
    <div class="vignette" aria-hidden="true"></div>

    <!-- ===== 皮箱层 ===== -->
    <div class="glow-open" id="glowOpen" aria-hidden="true"></div>
    <img class="suitcase suitcase-closed" id="suitcaseClosed" src="assets/suitcase-closed.png" alt="悬浮的旧皮箱">
    <img class="suitcase suitcase-open" id="suitcaseOpen" src="assets/suitcase-open.png" alt="打开的皮箱，透出金光与旧物">

    <!-- ===== 对话文字 ===== -->
    <div class="dialogue" id="dialogue">你外婆让我等到你决意来南京，再把它给你。</div>

    <!-- ===== 三角标识（背包入口） ===== -->
    <button class="tri-btn" id="invBtn" aria-label="打开背包物品栏">
      <span class="badge" id="badge">0</span>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 7 L59 57 H5 Z" fill="rgba(18,12,6,.42)" stroke="#d9a35c" stroke-width="4" stroke-linejoin="round"/>
        <rect x="23.5" y="30" width="17" height="14.5" rx="2.5" fill="none" stroke="#ecdcb4" stroke-width="2.6"/>
        <path d="M26.5 30 v-5.5 a5.5 5.5 0 0 1 11 0 v5.5" fill="none" stroke="#ecdcb4" stroke-width="2.6"/>
        <circle cx="32" cy="37.5" r="2.2" fill="#ecdcb4"/>
      </svg>
    </button>

    <!-- ===== 交互热区：皮箱 ===== -->
    <button class="hotspot hotspot-suitcase" id="suitcaseBtn" aria-label="打开或合上皮箱"></button>

    <!-- ===== 特效层 ===== -->
    <div class="flash" id="flash" aria-hidden="true"></div>
    <div class="burst" id="burst" aria-hidden="true"></div>

    <!-- ===== 背包面板 ===== -->
    <div class="scrim" id="scrim"></div>
    <div class="inventory-panel" id="panel" role="dialog" aria-label="背包物品栏">
      <div class="panel-head">
        <div class="panel-title">背包<em> · 外婆的旧物</em></div>
        <button class="panel-close" id="panelClose" aria-label="关闭背包">×</button>
      </div>
      <div class="item-grid" id="itemGrid"><div class="empty-tip">空</div></div>
      <div class="item-detail" id="itemDetail"><span class="dim">皮箱还没有打开，旧物都在里面</span></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
(function(){
'use strict';
/* ============ 数据 ============ */
var state={entered:false,opened:false,collected:false,invOpen:false,sel:-1};
var stage=document.getElementById('stage');
var bgVideo=document.getElementById('bgVideo');
var suitcaseBtn=document.getElementById('suitcaseBtn');
var invBtn=document.getElementById('invBtn');
var badge=document.getElementById('badge');
var flash=document.getElementById('flash');
var burst=document.getElementById('burst');
var suitcaseClosed=document.getElementById('suitcaseClosed');
var suitcaseOpen=document.getElementById('suitcaseOpen');
var glowOpen=document.getElementById('glowOpen');
var panel=document.getElementById('panel');
var scrim=document.getElementById('scrim');
var itemGrid=document.getElementById('itemGrid');
var itemDetail=document.getElementById('itemDetail');
var toastEl=document.getElementById('toast');
var toastTimer=null;

/* ============ 提示 ============ */
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},2600);
}

/* ============ 入场：5 秒后皮箱弹出 ============ */
function startIntro(){
  var p=bgVideo.play();
  if(p&&p.catch){p.catch(function(){});}
  setTimeout(function(){
    state.entered=true;
    stage.classList.add('entered');
    flash.classList.add('go');       // 落地微闪
    spawnAmbientPapers();            // 纸张开始飘动
  },5000);
}
function spawnAmbientPapers(){
  var colors=['#efe4c4','#e6d8b4','#dfcfa1'];
  var spots=[
    {l:'38%',t:'52%',w:34,r0:'8deg',r1:'-14deg',dx:'26px',dy:'-18px'},
    {l:'58%',t:'47%',w:30,r0:'-6deg',r1:'12deg',dx:'-22px',dy:'16px'},
    {l:'47%',t:'63%',w:27,r0:'15deg',r1:'-9deg',dx:'18px',dy:'-14px'}
  ];
  spots.forEach(function(s,i){
    var p=document.createElement('span');
    p.className='paper ambient';
    var w=s.w;
    p.style.width=w+'px';
    p.style.height=(w*1.3)+'px';
    p.style.background='linear-gradient(160deg,'+colors[i%3]+',#cfbf92)';
    p.style.left=s.l;
    p.style.top=s.t;
    p.style.setProperty('--r0',s.r0);
    p.style.setProperty('--r1',s.r1);
    p.style.setProperty('--dx',s.dx);
    p.style.setProperty('--dy',s.dy);
    p.style.animationDelay=(i*1.2)+'s';
    stage.appendChild(p);
  });
}

/* ============ 开箱 / 合箱 ============ */
function openSuitcase(){
  if(state.opened)return;
  if(!state.entered){toast('皮箱还在路上…');return;}
  state.opened=true;
  flash.classList.add('go');
  burst.classList.add('go');
  suitcaseClosed.style.transition='opacity .28s ease';
  suitcaseClosed.style.opacity=0;
  suitcaseOpen.classList.add('show');
  glowOpen.classList.add('show');
  spawnDust();
  spawnFlyPapers();
  setTimeout(function(){
    state.collected=true;
    toast('箱子打开了——外婆的旧物，都在这里了');
    setTimeout(function(){
      document.getElementById('page').classList.add('fade-out');
      setTimeout(function(){window.location.href='序章-开箱.html';},520);
    },900);
  },1150);
}
function closeSuitcase(){
  if(!state.opened)return;
  state.opened=false;
  suitcaseOpen.classList.remove('show');
  glowOpen.classList.remove('show');
  suitcaseClosed.style.transition='opacity .4s ease .1s';
  suitcaseClosed.style.opacity=1;
  toast('箱子合上了');
}
suitcaseBtn.addEventListener('click',function(){
  if(!state.entered){toast('皮箱还在路上…');return;}
  if(state.opened)closeSuitcase();else openSuitcase();
});

/* ============ 开箱粒子与飞纸 ============ */
function spawnDust(){
  for(var i=0;i<22;i++){
    var d=document.createElement('span');
    d.className='dust';
    d.style.left=(50+(Math.random()-0.5)*34)+'%';
    d.style.top=(54+(Math.random()-0.5)*22)+'%';
    var s=3+Math.random()*5;
    d.style.width=s+'px';
    d.style.height=s+'px';
    stage.appendChild(d);
    var dx=(Math.random()-0.5)*220;
    var dy=-60-Math.random()*160;
    d.animate([
      {transform:'translate(0,0) scale(.5)',opacity:0},
      {transform:'translate('+dx*0.4+'px,'+dy*0.4+'px) scale(1)',opacity:.9,offset:.35},
      {transform:'translate('+dx+'px,'+dy+'px) scale(.3)',opacity:0}
    ],{duration:1300+Math.random()*900,delay:180+Math.random()*520,easing:'cubic-bezier(.2,.7,.4,1)'});
    d.getAnimations()[0].onfinish=function(){d.remove();};
  }
}
function spawnFlyPapers(){
  var colors=['#efe4c4','#e6d8b4','#dfcfa1'];
  for(var i=0;i<5;i++){
    var p=document.createElement('span');
    p.className='paper';
    var w=24+Math.random()*26;
    p.style.width=w+'px';
    p.style.height=(w*1.3)+'px';
    p.style.background='linear-gradient(160deg,'+colors[i%3]+',#cfbf92)';
    p.style.left='50%';
    p.style.top='55%';
    stage.appendChild(p);
    var ang=Math.random()*360;
    var dist=120+Math.random()*240;
    var dx=Math.cos(ang*Math.PI/180)*dist;
    var dy=Math.sin(ang*Math.PI/180)*dist*0.5-70;
    p.animate([
      {transform:'translate(-50%,-50%) rotate(0deg) scale(.7)',opacity:0},
      {transform:'translate(-50%,-50%) rotate('+(8+Math.random()*30)+'deg) scale(1)',opacity:.95,offset:.3},
      {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) rotate('+(45+Math.random()*70)+'deg) scale(.75)',opacity:0}
    ],{duration:1500+Math.random()*750,easing:'cubic-bezier(.25,.6,.35,1)'});
    p.getAnimations()[0].onfinish=function(){p.remove();};
  }
}

/* ============ 背包面板 ============ */
function toggleInv(force){
  var willOpen=(typeof force==='boolean')?force:!state.invOpen;
  state.invOpen=willOpen;
  panel.classList.toggle('open',willOpen);
  scrim.classList.toggle('on',willOpen);
  if(willOpen&&!state.collected){
    toast('箱子还没打开，先点一下那只皮箱');
  }
}
invBtn.addEventListener('click',function(){toggleInv();});
scrim.addEventListener('click',function(){toggleInv(false);});
document.getElementById('panelClose').addEventListener('click',function(){toggleInv(false);});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&state.invOpen)toggleInv(false);
});

/* 启动 */
startIntro();
})();
</script>

/* 日晷刻度环 overlay + 拨动金光 */
var NS='http://www.w3.org/2000/svg';
function addRing(d){
  if(d.querySelector('.dh-ring'))return;
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('class','dh-ring');
  var g=document.createElementNS(NS,'g');
  var rim=document.createElementNS(NS,'circle');
  rim.setAttribute('cx','50');rim.setAttribute('cy','50');rim.setAttribute('r','46');
  rim.setAttribute('fill','none');rim.setAttribute('stroke','rgba(214,178,106,.95)');rim.setAttribute('stroke-width','2.4');
  g.appendChild(rim);
  var names=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  for(var i=0;i<12;i++){
    var a=(i*30-90)*Math.PI/180;
    var inner=42,outer=(i%3===0)?45.5:43.5;
    var ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',50+inner*Math.cos(a));ln.setAttribute('y1',50+inner*Math.sin(a));
    ln.setAttribute('x2',50+outer*Math.cos(a));ln.setAttribute('y2',50+outer*Math.sin(a));
    ln.setAttribute('stroke','rgba(240,205,120,.95)');ln.setAttribute('stroke-width',i%3===0?'1.6':'1');ln.setAttribute('stroke-linecap','round');
    g.appendChild(ln);
    var t=document.createElementNS(NS,'text');
    t.setAttribute('x',50+30*Math.cos(a));t.setAttribute('y',50+30*Math.sin(a)+3);
    t.setAttribute('text-anchor','middle');t.setAttribute('font-size','6.6');
    t.setAttribute('fill','rgba(233,208,158,.95)');t.setAttribute('font-family','Kaiti SC,STKaiti,serif');
    t.textContent=names[i];g.appendChild(t);
  }
  svg.appendChild(g);d.appendChild(svg);
  var timer=null;
  function glow(){d.classList.remove('dh-glow');void d.offsetWidth;d.classList.add('dh-glow');if(timer)clearTimeout(timer);timer=setTimeout(function(){d.classList.remove('dh-glow');},1100);}
  try{
    var ob=new MutationObserver(function(muts){for(var k=0;k<muts.length;k++){if(muts[k].type==='attributes'){glow();break;}}});
    ob.observe(d,{subtree:true,attributes:true,attributeFilter:['transform','style']});
  }catch(e){}
  d.addEventListener('click',glow);
}
function init(){var ds=document.querySelectorAll('.sundial,.dial-btn');for(var i=0;i<ds.length;i++)addRing(ds[i]);}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
